<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Text Correction</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono&family=Frank+Ruhl+Libre:wght@400;500&display=swap">
<link rel="stylesheet" href="/static/styles.css">
</head>
<body>
<header class="top">
  <h1>Text Correction</h1>
  <span class="muted small">Find and fix transcription errors in Sefaria Hebrew versions</span>
  <span class="spacer"></span>
  <span class="small muted" id="me"></span>
  <a class="small" href="/logout">Sign out</a>
</header>

<div class="page">
  <section class="card" aria-labelledby="new-h">
    <h2 id="new-h">New project</h2>
    <form id="new" class="form-grid" autocomplete="off">
      <label>Book
        <div class="suggest">
          <input id="book" required placeholder="Start typing a book title…" role="combobox" aria-expanded="false" aria-controls="book-list" aria-autocomplete="list">
          <ul id="book-list" role="listbox" hidden></ul>
        </div>
      </label>
      <label>Hebrew version
        <select id="version" required disabled><option value="">Choose a book first</option></select>
      </label>
      <label>Reference text <span class="muted">(optional · .txt, .html, .docx, .pdf, .csv)</span>
        <input id="reference" type="file" accept=".txt,.text,.md,.html,.htm,.docx,.pdf,.csv">
      </label>
      <label>Project name <span class="muted">(optional)</span>
        <input id="name" placeholder="Defaults to book — version">
      </label>
      <details style="grid-column: 1 / -1">
        <summary class="small muted">Advanced</summary>
        <div class="form-grid" style="margin-top:10px">
          <label>Detector threshold <span class="muted">(blank = model default 0.536; lower finds more, with more false positives)</span>
            <input id="threshold" type="number" min="0.05" max="0.99" step="0.01" placeholder="0.536">
          </label>
          <label>LLM check
            <select id="llm">
              <option value="">Gemini 3.8 Flash (recommended: best accuracy, ~$5.50 per 1,000 flags)</option>
              <option value="gemini:gemini-3.8-flash:low:8">Gemini 3.8 Flash, low thinking (8× cheaper, misses more errors)</option>
              <option value="anthropic:claude-sonnet-5-5:low:8">Claude Sonnet 5.5 (keeps many more false positives)</option>
            </select>
          </label>
        </div>
      </details>
      <div class="row" style="grid-column: 1 / -1">
        <button class="primary" type="submit" id="create">Start</button>
        <span class="small muted" id="version-info"></span>
      </div>
    </form>
  </section>

  <section class="card" aria-labelledby="proj-h">
    <div class="row" style="margin-bottom:10px">
      <h2 id="proj-h" style="margin:0">Projects</h2>
      <span class="spacer"></span>
      <label class="small"><input type="checkbox" id="all"> Everyone's</label>
      <label class="small"><input type="checkbox" id="archived"> Archived</label>
    </div>
    <div class="scroll">
      <table>
        <thead><tr><th>Project</th><th>Version</th><th>Reference</th><th style="min-width:200px">Status</th><th>Review</th><th>Updated</th><th></th></tr></thead>
        <tbody id="projects"></tbody>
      </table>
    </div>
    <p class="empty" id="no-projects" hidden>No projects yet. Start one above.</p>
  </section>
</div>
<script type="module" src="/static/app.js"></script>
</body>
</html>
